# Configuración del proceso de actualización de Tiempos DAC (sin secretos).
# Las credenciales SQL son las mismas de Loan Tape / Módulo de Garantías (Administrador de credenciales de Windows).

[servidor]
server = 'SRV-TORTUGUERO\DATAWAREHOUSE'   # comillas simples: la barra invertida se toma literal
database = "GENESIS_REGIONAL"
driver = "ODBC Driver 18 for SQL Server"   # si no está instalado se usa el más nuevo disponible
servicio_credenciales = "modulo_garantias_sql"

[consultas]
