[supabase]
url = "https://lzgteejsjxrbadsqlpnd.supabase.co"
anon_key = ""            # misma clave pública que public/config.js
usuario = "sistema"      # usuario de carga (rol sistema); su contraseña va en el Administrador de credenciales
servicio_credenciales = "tiempos_dac_supabase"
